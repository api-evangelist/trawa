name: trawa
description: trawa (operated by Future Energy Services GmbH) is a Berlin-based energy
  management company that helps mid-sized businesses procure and manage electricity.
  It pairs AI-optimized green-electricity sourcing on the wholesale market with cloud
  energy-management software that gives customers real-time visibility into consumption,
  costs, and CO2 emissions, alongside battery storage and smart control of energy-consuming
  assets such as CHP plants and charging stations. Founded in 2022, trawa is backed
  by Balderton Capital and Speedinvest. The platform is delivered through a customer
  web portal and a trust center; no public developer API was found as of this enrichment
  pass.
